<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AlsetOS · Escritorio</title>
<style>
:root{
  --bg:#0b1220; --desk:#0e1628; --panel:#141e30; --panel2:#1a2640;
  --border:rgba(120,160,220,.18); --text:#eef4ff; --muted:#8fa3c4;
  --accent:#3dffa8; --blue:#5b9dff; --warn:#ffc857; --danger:#ff6b8a;
  --win-bar:#121a2b; --radius:14px; --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:#000}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1a2a4a,#070b14 70%);z-index:1000}
.gate.hidden{display:none}
.splash-mark{font-size:56px;line-height:1;filter:drop-shadow(0 0 24px rgba(61,255,168,.45))}
.splash-title{font-size:28px;font-weight:800;letter-spacing:.12em;margin-top:12px}
.splash-sub{color:var(--muted);margin-top:6px;font-size:13px}
.splash-bar{width:180px;height:4px;background:#1e2a40;border-radius:99px;margin-top:22px;overflow:hidden}
.splash-bar span{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--blue));animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.login-card{width:min(360px,92vw);background:rgba(20,30,48,.92);border:1px solid var(--border);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.login-card h2{margin:8px 0 4px;font-size:20px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.login-card input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0a1220;color:var(--text)}
.btn-login{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--blue));color:#061018}
.login-err{color:var(--danger);font-size:12px;min-height:16px}
.hidden{display:none!important}
#os{position:fixed;inset:0;display:flex;flex-direction:column}
#desktop{flex:1;position:relative;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(61,255,168,.08),transparent 50%),
  radial-gradient(900px 500px at 90% 20%,rgba(91,157,255,.12),transparent 45%),
  linear-gradient(160deg,#0a1020 0%,#0e1628 40%,#0b1424 100%);
  overflow:hidden}
#icon-layer{position:absolute;inset:12px 12px 56px 12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;pointer-events:none}
.desk-icon{pointer-events:auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;cursor:pointer;user-select:none;border:1px solid transparent}
.desk-icon:hover{background:rgba(255,255,255,.06);border-color:var(--border)}
.desk-icon .glyph{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.desk-icon .label{font-size:11px;text-align:center;text-shadow:0 1px 3px #000;line-height:1.2;max-width:84px}
.g-studio{background:linear-gradient(135deg,#2ae89a,#4f7dff)}
.g-org{background:linear-gradient(135deg,#7c5cff,#3dffa8)}
.g-pulse{background:linear-gradient(135deg,#5b9dff,#a78bfa)}
.g-files{background:linear-gradient(135deg,#fbbf24,#f97316)}
.g-term{background:linear-gradient(135deg,#334155,#64748b)}
.g-mind{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.g-settings{background:linear-gradient(135deg,#64748b,#94a3b8)}
#window-layer{position:absolute;inset:0;pointer-events:none}
.window{pointer-events:auto;position:absolute;min-width:320px;min-height:220px;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.window.active{border-color:rgba(61,255,168,.35);z-index:20}
.wtitle{height:40px;background:var(--win-bar);display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;cursor:move;user-select:none;border-bottom:1px solid var(--border)}
.wtitle .dot{width:12px;height:12px;border-radius:50%}
.wtitle .t{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle button{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.wtitle button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.wbody{flex:1;overflow:auto;background:var(--desk)}
#taskbar{height:48px;background:rgba(10,16,28,.92);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:8px;backdrop-filter:blur(10px);z-index:50}
.start-btn{width:40px;height:36px;border-radius:10px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(61,255,168,.2),rgba(91,157,255,.2));color:var(--accent);font-size:18px;cursor:pointer}
#task-buttons{flex:1;display:flex;gap:6px;overflow:auto}
.task-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:12px;cursor:pointer;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-btn.active{border-color:rgba(61,255,168,.4);background:rgba(61,255,168,.1)}
.tray{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tray-chip{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.start-menu{position:absolute;left:10px;bottom:56px;width:280px;max-height:70vh;overflow:auto;background:rgba(16,24,40,.96);border:1px solid var(--border);border-radius:16px;padding:10px;box-shadow:var(--shadow);z-index:60}
.start-menu.hidden{display:none}
.start-brand{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:8px 10px 6px;font-weight:700}
.start-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px}
.start-menu button:hover{background:rgba(255,255,255,.06)}
.start-menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
/* app content */
.app-pad{padding:14px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--accent)}
.oid{font-family:ui-monospace,monospace;font-size:11px;color:var(--blue);word-break:break-all}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:12px}
.btn.primary{background:linear-gradient(135deg,#2ae89a,#4f7dff);color:#061018;border:0;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0a1220;color:var(--text);font-size:13px}
pre.out{background:#0a1220;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:200px}
/* ORGES Studio layout */
.studio{display:grid;grid-template-columns:200px 1fr 1fr;grid-template-rows:40px 1fr;height:100%;min-height:420px}
.studio-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--win-bar)}
.studio-side{border-right:1px solid var(--border);overflow:auto;padding:8px;background:#0f1726}
.studio-main{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
.studio-preview{display:flex;flex-direction:column;min-width:0;background:#0a101c}
.studio-side .item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:4px;border:1px solid transparent}
.studio-side .item:hover,.studio-side .item.on{background:rgba(61,255,168,.08);border-color:var(--border)}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--border)}
.tabs button{padding:6px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.tabs button.on{background:rgba(91,157,255,.15);color:var(--text)}
.editor-area{flex:1;display:flex;flex-direction:column;min-height:0}
.editor-area textarea{flex:1;width:100%;border:0;resize:none;padding:12px;background:#0a1220;color:#d6e4ff;font-family:ui-monospace,monospace;font-size:12px;line-height:1.45}
.preview-bar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center}
.device-frame{flex:1;display:grid;place-items:center;padding:12px;overflow:auto}
.device{background:#fff;color:#111;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden;transition:width .2s,height .2s}
.device.web{width:100%;max-width:100%;height:100%;border-radius:8px}
.device.desktop{width:92%;height:88%}
.device.android{width:320px;height:560px;border-radius:28px;border:8px solid #222}
.device-inner{padding:12px;height:100%;overflow:auto;font-size:13px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted);margin:2px}
.org-row{padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.03)}
</style>
</head>
<body>
<div id="splash" class="gate">
  <div style="text-align:center">
    <div class="splash-mark">⬡</div>
    <div class="splash-title">AlsetOS</div>
    <div class="splash-sub">Escritorio soberano · organismos · ATS-001</div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>
<div id="login" class="gate hidden">
  <div class="login-card">
    <div class="splash-mark" style="font-size:32px;text-align:center">⬡</div>
    <h2 style="text-align:center">Bienvenido</h2>
    <p class="muted" style="text-align:center;margin:0">Cuenta Master · AlsetOS Native</p>
    <label>Usuario</label>
    <input id="login-user" value="Master"/>
    <label>Contraseña</label>
    <input id="login-pass" type="password" value="master"/>
    <button type="button" class="btn-login" id="login-btn">Entrar</button>
    <p class="login-err" id="login-err"></p>
  </div>
</div>

<div id="os" class="hidden">
  <div id="desktop">
    <div id="icon-layer"></div>
    <div id="window-layer"></div>
    <div id="start-menu" class="start-menu hidden">
      <div class="start-brand">ALSET OS · Native</div>
      <button type="button" data-app="studio">◈ ORGES Studio</button>
      <button type="button" data-app="organisms">◎ Organismos</button>
      <button type="button" data-app="pulse">⚡ Pulse</button>
      <button type="button" data-app="mind">◎ Mind · Zyrion</button>
      <button type="button" data-app="terminal">▣ Terminal</button>
      <button type="button" data-app="status">▤ Estado del nodo</button>
      <hr/>
      <button type="button" data-app="about">ℹ Acerca de</button>
      <hr/>
      <button type="button" id="btn-logout">↩ Cerrar sesión</button>
    </div>
  </div>
  <footer id="taskbar">
    <button type="button" class="start-btn" id="btn-start" title="Menú">⬡</button>
    <div id="task-buttons"></div>
    <div class="tray">
      <span class="tray-chip" id="tray-orgs">0 orgs</span>
      <span class="tray-chip" id="tray-tick">tick 0</span>
      <span class="tray-chip" id="tray-clock">—</span>
    </div>
  </footer>
</div>

<script>
const APPS = {
  studio: { title: 'ORGES Studio', w: 980, h: 620, icon: '◈' },
  organisms: { title: 'Organismos', w: 520, h: 480, icon: '◎' },
  pulse: { title: 'Pulse', w: 480, h: 420, icon: '⚡' },
  mind: { title: 'Mind · Zyrion', w: 440, h: 360, icon: '◎' },
  terminal: { title: 'Terminal', w: 560, h: 360, icon: '▣' },
  status: { title: 'Estado del nodo', w: 480, h: 420, icon: '▤' },
  about: { title: 'Acerca de AlsetOS', w: 420, h: 320, icon: 'ℹ' },
};
const DESK_ICONS = [
  { app: 'studio', label: 'ORGES Studio', g: 'g-studio', glyph: '◈' },
  { app: 'organisms', label: 'Organismos', g: 'g-org', glyph: '◎' },
  { app: 'pulse', label: 'Pulse', g: 'g-pulse', glyph: '⚡' },
  { app: 'mind', label: 'Mind', g: 'g-mind', glyph: '🧠' },
  { app: 'terminal', label: 'Terminal', g: 'g-term', glyph: '▣' },
  { app: 'status', label: 'Estado', g: 'g-settings', glyph: '▤' },
];

let status = { organisms: [], ticks: 0, master_oid: '', audit: [] };
let zIndex = 20;
const windows = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function refresh() {
  try {
    status = await api('/api/status');
    document.getElementById('tray-orgs').textContent = (status.organisms || []).length + ' orgs';
    document.getElementById('tray-tick').textContent = 'tick ' + (status.ticks || 0);
    // refresh open windows that need data
    Object.keys(windows).forEach(id => {
      const w = windows[id];
      if (w && w.refresh) w.refresh();
    });
  } catch (e) { console.warn(e); }
}

function clock() {
  const d = new Date();
  document.getElementById('tray-clock').textContent =
    d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function buildIcons() {
  const layer = document.getElementById('icon-layer');
  layer.innerHTML = DESK_ICONS.map(i =>
    `<div class="desk-icon" data-app="${i.app}">
      <div class="glyph ${i.g}">${i.glyph}</div>
      <div class="label">${i.label}</div>
    </div>`
  ).join('');
  layer.querySelectorAll('.desk-icon').forEach(el => {
    el.ondblclick = () => openApp(el.dataset.app);
    el.onclick = () => openApp(el.dataset.app);
  });
}

function openApp(id) {
  if (!APPS[id]) return;
  if (windows[id]) {
    focusWin(id);
    return;
  }
  const meta = APPS[id];
  const el = document.createElement('div');
  el.className = 'window active';
  el.style.width = meta.w + 'px';
  el.style.height = meta.h + 'px';
  el.style.left = (40 + Object.keys(windows).length * 28) + 'px';
  el.style.top = (36 + Object.keys(windows).length * 24) + 'px';
  el.style.zIndex = ++zIndex;
  el.innerHTML = `
    <div class="wtitle">
      <span class="dot" style="background:var(--danger)"></span>
      <span class="dot" style="background:var(--warn)"></span>
      <span class="dot" style="background:var(--accent)"></span>
      <span class="t">${meta.icon} ${meta.title}</span>
      <button type="button" data-act="min">—</button>
      <button type="button" data-act="close">✕</button>
    </div>
    <div class="wbody"></div>`;
  document.getElementById('window-layer').appendChild(el);
  const body = el.querySelector('.wbody');
  const ctrl = { el, body, refresh: null };
  windows[id] = ctrl;
  renderApp(id, body, ctrl);
  makeDraggable(el);
  el.querySelector('[data-act="close"]').onclick = () => closeWin(id);
  el.querySelector('[data-act="min"]').onclick = () => { el.style.display = 'none'; syncTasks(); };
  el.onmousedown = () => focusWin(id);
  syncTasks();
}

function closeWin(id) {
  if (!windows[id]) return;
  windows[id].el.remove();
  delete windows[id];
  syncTasks();
}

function focusWin(id) {
  const w = windows[id];
  if (!w) return;
  w.el.style.display = '';
  w.el.style.zIndex = ++zIndex;
  document.querySelectorAll('.window').forEach(x => x.classList.remove('active'));
  w.el.classList.add('active');
  syncTasks();
}

function syncTasks() {
  const tb = document.getElementById('task-buttons');
  tb.innerHTML = Object.keys(windows).map(id => {
    const t = APPS[id].title;
    return `<button type="button" class="task-btn" data-id="${id}">${t}</button>`;
  }).join('');
  tb.querySelectorAll('.task-btn').forEach(b => {
    b.onclick = () => {
      const w = windows[b.dataset.id];
      if (w.el.style.display === 'none') focusWin(b.dataset.id);
      else if (w.el.classList.contains('active')) w.el.style.display = 'none';
      else focusWin(b.dataset.id);
      syncTasks();
    };
  });
}

function makeDraggable(win) {
  const bar = win.querySelector('.wtitle');
  let ox, oy, dragging = false;
  bar.onmousedown = e => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    ox = e.clientX - win.offsetLeft;
    oy = e.clientY - win.offsetTop;
    e.preventDefault();
  };
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    win.style.left = Math.max(0, e.clientX - ox) + 'px';
    win.style.top = Math.max(0, e.clientY - oy) + 'px';
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

/* ——— App bodies ——— */
function renderApp(id, body, ctrl) {
  if (id === 'studio') return renderStudio(body, ctrl);
  if (id === 'organisms') {
    const paint = () => {
      const orgs = status.organisms || [];
      body.innerHTML = `<div class="app-pad">
        <h3 style="margin:0 0 8px">Organismos del nodo</h3>
        <p class="muted" style="margin:0 0 12px">Todo es un organismo · incluyendo este escritorio</p>
        ${orgs.map(o => `<div class="org-row">
          <div><b>${o.kind || 'org'}</b> ${o.master ? '<span class="tag">MASTER</span>' : ''}</div>
          <div class="oid">${o.oid}</div>
          <div class="muted" style="margin-top:4px">RootCID ${o.root_cid}</div>
          <div style="margin-top:6px">${(o.capabilities || []).map(c => `<span class="tag">${c}</span>`).join('')}</div>
        </div>`).join('') || '<p class="muted">Sin organismos</p>'}
        <button class="btn" style="margin-top:8px" id="btn-tick">Scheduler tick</button>
      </div>`;
      body.querySelector('#btn-tick').onclick = () => api('/api/tick', { method: 'POST' }).then(refresh);
    };
    paint();
    ctrl.refresh = paint;
    return;
  }
  if (id === 'pulse') {
    body.innerHTML = `<div class="app-pad">
      <h3 style="margin-top:0">Pulse seguro</h3>
      <label class="f">Origen</label><select class="f" id="p-src"></select>
      <label class="f">Destino</label><select class="f" id="p-dst"></select>
      <label class="f">Payload JSON</label><textarea class="f" id="p-body" rows="4">{"tipo":"ping","msg":"hola desde el escritorio"}</textarea>
      <button class="btn primary" id="p-send" style="margin-top:10px">Enviar Pulse</button>
      <pre class="out" id="p-out" style="margin-top:10px"></pre>
    </div>`;
    const fill = () => {
      const opts = (status.organisms || []).map(o =>
        `<option value="${o.oid}">${o.kind || 'org'} · ${o.oid.slice(0, 28)}…</option>`).join('');
      body.querySelector('#p-src').innerHTML = opts;
      body.querySelector('#p-dst').innerHTML = opts;
    };
    fill();
    ctrl.refresh = fill;
    body.querySelector('#p-send').onclick = async () => {
      try {
        const payload = JSON.parse(body.querySelector('#p-body').value);
        const r = await api('/api/pulse', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: body.querySelector('#p-src').value, dest: body.querySelector('#p-dst').value, payload })
        });
        body.querySelector('#p-out').textContent = JSON.stringify(r, null, 2);
        await refresh();
      } catch (e) { body.querySelector('#p-out').textContent = String(e); }
    };
    return;
  }
  if (id === 'mind') {
    body.innerHTML = `<div class="app-pad">
      <h3 style="margin-top:0">Mind · Zyrion</h3>
      <p class="muted">Lógica ternaria nativa: <b>V</b> / <b>F</b> / <b>I</b>. La incertidumbre no se fuerza a falso.</p>
      <div class="grid2" style="margin-top:12px">
        <div class="card"><h3>Verdadero</h3><p class="muted">Hecho confirmado</p></div>
        <div class="card"><h3>Falso</h3><p class="muted">Negación confirmada</p></div>
        <div class="card"><h3>Indeterminado</h3><p class="muted">Evidencia insuficiente</p></div>
      </div>
      <p class="muted" style="margin-top:14px">Master OID</p>
      <div class="oid">${status.master_oid || '—'}</div>
    </div>`;
    return;
  }
  if (id === 'terminal') {
    body.innerHTML = `<div class="app-pad" style="height:100%;display:flex;flex-direction:column">
      <p class="muted" style="margin:0 0 8px">Comandos: status · tick · orgs · help</p>
      <pre class="out" id="term-out" style="flex:1;max-height:none">AlsetOS terminal · ATS-001\n</pre>
      <input class="f" id="term-in" placeholder="comando…" style="margin-top:8px"/>
    </div>`;
    const out = body.querySelector('#term-out');
    const run = async (line) => {
      out.textContent += '> ' + line + '\n';
      const c = line.trim().toLowerCase();
      if (c === 'help') out.textContent += 'status | tick | orgs | help\n';
      else if (c === 'status') { await refresh(); out.textContent += JSON.stringify({ ticks: status.ticks, master: status.master_oid, n: (status.organisms||[]).length }, null, 2) + '\n'; }
      else if (c === 'tick') { const r = await api('/api/tick', { method: 'POST' }); out.textContent += JSON.stringify(r) + '\n'; await refresh(); }
      else if (c === 'orgs') { await refresh(); (status.organisms||[]).forEach(o => out.textContent += o.oid + ' · ' + o.kind + '\n'); }
      else out.textContent += 'desconocido\n';
      out.scrollTop = out.scrollHeight;
    };
    body.querySelector('#term-in').onkeydown = e => {
      if (e.key === 'Enter') { run(e.target.value); e.target.value = ''; }
    };
    return;
  }
  if (id === 'status') {
    const paint = () => {
      body.innerHTML = `<div class="app-pad">
        <h3 style="margin-top:0">Estado del nodo</h3>
        <pre class="out" style="max-height:340px">${JSON.stringify(status, null, 2)}</pre>
        <button class="btn" id="st-ref">Actualizar</button>
      </div>`;
      body.querySelector('#st-ref').onclick = refresh;
    };
    paint();
    ctrl.refresh = paint;
    return;
  }
  if (id === 'about') {
    body.innerHTML = `<div class="app-pad">
      <h3 style="margin-top:0">AlsetOS Native</h3>
      <p class="muted">Gestor de escritorio como organismo. La unidad no es el proceso: es el organismo (OID + RootCID + capacidades + Mind + Pulse).</p>
      <ul class="muted">
        <li>ATS-001 fiel en núcleo Go</li>
        <li>ORGES Studio instalado por defecto</li>
        <li>Sin TinyCore · sin Node en el runtime</li>
      </ul>
    </div>`;
  }
}

/* ORGES Studio — no-code + código + preview web/desktop/android */
const TEMPLATES = {
  financiero: {
    name: 'ORGES Financiero',
    goals: ['seguridad', 'cumplimiento', 'alerta_fraude'],
    caps: ['pulse.send', 'pulse.receive', 'ejecutar'],
    code: `;; ORGES financiero — reglas de ejemplo
(orges "financiero"
  (goal "seguridad")
  (goal "cumplimiento")
  (rule "monto_alto"
    (cuando (> monto 10000))
    (entonces (marcar_alerta "revision")))
  (ui
    (titulo "Panel financiero")
    (kpi "transacciones")
    (kpi "alertas")
    (lista "ultimos_eventos")))
`,
    ui: { title: 'Panel financiero', kpis: ['Transacciones', 'Alertas', 'Riesgo'], color: '#0d9488' }
  },
  medico: {
    name: 'ORGES Médico',
    goals: ['privacidad', 'triaje'],
    caps: ['pulse.receive', 'ejecutar'],
    code: `;; ORGES médico
(orges "medico"
  (goal "privacidad")
  (goal "triaje")
  (ui (titulo "Triaje") (lista "pacientes")))
`,
    ui: { title: 'Triaje', kpis: ['En espera', 'Críticos'], color: '#e11d48' }
  },
  custom: {
    name: 'ORGES Custom',
    goals: ['objetivo'],
    caps: ['pulse.receive'],
    code: `;; Tu ORGES
(orges "custom"
  (goal "objetivo")
  (ui (titulo "Mi ORGES") (texto "Edita este código")))
`,
    ui: { title: 'Mi ORGES', kpis: ['Estado'], color: '#6366f1' }
  }
};

function renderStudio(body, ctrl) {
  let kind = 'financiero';
  let mode = 'nocode'; // nocode | code
  let device = 'web'; // web | desktop | android
  let lastDeploy = null;

  const paint = () => {
    const t = TEMPLATES[kind] || TEMPLATES.custom;
    body.innerHTML = `<div class="studio">
      <div class="studio-top">
        <strong style="font-size:13px">ORGES Studio</strong>
        <span class="tag">no-code</span>
        <span class="tag">código</span>
        <span class="tag">preview</span>
        <span style="flex:1"></span>
        <button class="btn" id="st-run">Ejecutar</button>
        <button class="btn primary" id="st-deploy">Desplegar organismo</button>
      </div>
      <div class="studio-side">
        <div class="muted" style="font-size:11px;padding:4px 8px">Plantillas</div>
        ${Object.keys(TEMPLATES).map(k =>
          `<div class="item ${k === kind ? 'on' : ''}" data-k="${k}">${TEMPLATES[k].name}</div>`
        ).join('')}
        <div class="muted" style="font-size:11px;padding:12px 8px 4px">Desplegados</div>
        ${(status.organisms || []).filter(o => (o.kind || '').startsWith('orges')).map(o =>
          `<div class="item" style="font-size:11px">${o.kind}<br/><span class="oid">${o.oid.slice(0, 24)}…</span></div>`
        ).join('') || '<div class="muted" style="padding:8px;font-size:11px">Ninguno aún</div>'}
      </div>
      <div class="studio-main">
        <div class="tabs">
          <button type="button" class="${mode === 'nocode' ? 'on' : ''}" data-m="nocode">No-code</button>
          <button type="button" class="${mode === 'code' ? 'on' : ''}" data-m="code">Código</button>
        </div>
        <div class="editor-area" id="ed-area"></div>
      </div>
      <div class="studio-preview">
        <div class="preview-bar">
          <span class="muted" style="font-size:12px">Preview</span>
          <button class="btn ${device === 'web' ? 'primary' : ''}" data-d="web">Web</button>
          <button class="btn ${device === 'desktop' ? 'primary' : ''}" data-d="desktop">Escritorio</button>
          <button class="btn ${device === 'android' ? 'primary' : ''}" data-d="android">Android</button>
        </div>
        <div class="device-frame"><div class="device ${device}" id="prev-dev"></div></div>
      </div>
    </div>`;

    // editor pane
    const area = body.querySelector('#ed-area');
    if (mode === 'nocode') {
      area.innerHTML = `<div class="app-pad">
        <label class="f">Nombre</label>
        <input class="f" id="nc-name" value="${t.name}"/>
        <label class="f">Dominio</label>
        <select class="f" id="nc-kind">
          <option value="financiero">financiero</option>
          <option value="medico">medico</option>
          <option value="juridico">juridico</option>
          <option value="educativo">educativo</option>
          <option value="ia">ia</option>
          <option value="custom">custom</option>
        </select>
        <label class="f">Goals (coma)</label>
        <input class="f" id="nc-goals" value="${t.goals.join(', ')}"/>
        <label class="f">Capabilities (coma)</label>
        <input class="f" id="nc-caps" value="${t.caps.join(', ')}"/>
        <label class="f">Título UI</label>
        <input class="f" id="nc-title" value="${t.ui.title}"/>
        <p class="muted" style="margin-top:12px;font-size:12px">Cambia a la pestaña Código para editar cada línea. El preview se actualiza al vuelo.</p>
      </div>`;
      area.querySelector('#nc-kind').value = kind === 'custom' ? 'custom' : kind;
      area.querySelector('#nc-kind').onchange = e => { kind = e.target.value in TEMPLATES ? e.target.value : 'custom'; paint(); };
    } else {
      area.innerHTML = `<textarea id="code-ed" spellcheck="false">${t.code}</textarea>`;
    }

    // preview
    const ui = t.ui;
    body.querySelector('#prev-dev').innerHTML = `<div class="device-inner" style="border-top:4px solid ${ui.color}">
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">${ui.title}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        ${(ui.kpis || []).map(k => `<div style="flex:1;min-width:80px;background:#f1f5f9;border-radius:8px;padding:8px"><div style="font-size:10px;color:#64748b">${k}</div><div style="font-weight:700;font-size:18px">—</div></div>`).join('')}
      </div>
      <div style="background:#f8fafc;border-radius:8px;padding:10px;font-size:12px;color:#475569">
        Organismo ORGES · preview ${device}<br/>
        Goals: ${(t.goals || []).join(', ')}<br/>
        ${lastDeploy ? 'Desplegado: ' + lastDeploy : 'Sin desplegar aún'}
      </div>
    </div>`;

    body.querySelectorAll('.studio-side .item[data-k]').forEach(el => {
      el.onclick = () => { kind = el.dataset.k; paint(); };
    });
    body.querySelectorAll('.tabs button').forEach(b => {
      b.onclick = () => { mode = b.dataset.m; paint(); };
    });
    body.querySelectorAll('.preview-bar button[data-d]').forEach(b => {
      b.onclick = () => { device = b.dataset.d; paint(); };
    });

    body.querySelector('#st-run').onclick = () => {
      // "execute" = tick + refresh preview message
      api('/api/tick', { method: 'POST' }).then(refresh);
      lastDeploy = lastDeploy || '(ejecución local)';
      paint();
    };
    body.querySelector('#st-deploy').onclick = async () => {
      let name = t.name, goals = t.goals, caps = t.caps, k = kind;
      if (mode === 'nocode') {
        name = body.querySelector('#nc-name')?.value || name;
        k = body.querySelector('#nc-kind')?.value || k;
        goals = (body.querySelector('#nc-goals')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        caps = (body.querySelector('#nc-caps')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
      }
      try {
        const r = await api('/api/orges', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, kind: k, goals, caps })
        });
        lastDeploy = r.oid;
        await refresh();
        paint();
      } catch (e) { alert(String(e)); }
    };
  };

  paint();
  ctrl.refresh = () => {
    // soft refresh list only if studio open
    const side = body.querySelector('.studio-side');
    if (!side) return;
  };
}

/* boot UI */
document.getElementById('login-btn').onclick = () => {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if (u === 'Master' && p === 'master') {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('os').classList.remove('hidden');
    buildIcons();
    refresh();
    openApp('studio');
  } else {
    document.getElementById('login-err').textContent = 'Credenciales incorrectas (Master / master)';
  }
};
document.getElementById('btn-start').onclick = () => {
  document.getElementById('start-menu').classList.toggle('hidden');
};
document.getElementById('start-menu').querySelectorAll('[data-app]').forEach(b => {
  b.onclick = () => {
    document.getElementById('start-menu').classList.add('hidden');
    openApp(b.dataset.app);
  };
});
document.getElementById('btn-logout').onclick = () => {
  document.getElementById('os').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('start-menu').classList.add('hidden');
};
document.getElementById('desktop').onclick = e => {
  if (e.target.id === 'desktop' || e.target.id === 'icon-layer') {
    document.getElementById('start-menu').classList.add('hidden');
  }
};

setTimeout(() => {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}, 1400);
setInterval(clock, 1000);
clock();
setInterval(refresh, 5000);
</script>
</body>
</html>
