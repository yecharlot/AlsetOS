<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alset Desktop</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div id="os">
    <!-- Wallpaper + desktop surface -->
    <div id="desktop" aria-label="Escritorio Alset">
      <div id="icon-layer"></div>
      <div id="window-layer"></div>
    </div>

    <!-- Start menu -->
    <div id="start-menu" class="start-menu hidden" role="menu">
      <div class="start-brand">ALSET OS <small>Desktop</small></div>
      <button type="button" data-launch="studio">◈ Alset Studio</button>
      <button type="button" data-launch="editor">◇ Alset-JS Editor</button>
      <button type="button" data-launch="files">📁 Archivos</button>
      <button type="button" data-launch="apps">▦ Apps instaladas</button>
      <button type="button" data-launch="terminal">▣ Terminal LispAI</button>
      <button type="button" data-launch="mind">◎ Mind · Zyrion · Neural</button>
      <button type="button" data-launch="organism">⚡ Organismo</button>
      <button type="button" data-launch="settings">⚙ Ajustes</button>
      <button type="button" data-launch="status">▤ Estado</button>
      <hr />
      <button type="button" data-launch="about">ℹ Acerca de</button>
      <hr />
      <div class="start-brand" style="padding-top:4px">Apps del sistema</div>
      <button type="button" data-launch="app:org-manager">◎ Organismos</button>
      <button type="button" data-launch="app:doc-reader">📄 Documentos</button>
      <button type="button" data-launch="app:image-viewer">🖼 Imágenes</button>
      <button type="button" data-launch="app:audio-player">♫ Audio</button>
      <button type="button" data-launch="app:video-player">▶ Video</button>
      <button type="button" data-launch="app:accounts">👤 Cuentas</button>
      <button type="button" data-launch="app:ipfs-store">⬡ IPFS Store</button>
      <button type="button" data-launch="app:files-ui">📁 Archivos</button>
      <button type="button" data-launch="app:calculadora">🔢 Calculadora</button>
    </div>

    <!-- Dock / taskbar -->
    <footer id="taskbar">
      <button type="button" id="btn-start" class="start-btn" title="Menú Alset">⬡</button>
      <div id="task-buttons" class="task-buttons"></div>
      <div class="tray">
        <button type="button" id="tray-net" class="tray-chip tray-btn" title="Red y volúmenes">🌐 Red</button>
        <span id="tray-mind" class="tray-chip" title="Mind">Mind · —</span>
        <span id="tray-clock" class="tray-clock">—</span>
      </div>
    </footer>
  </div>
  <script src="shell.js"></script>
</body>
</html>
