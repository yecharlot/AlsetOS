name: Prueba AlsetOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Ejecutar flujo organismo
        run: go run ./cmd/alsetos
